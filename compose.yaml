services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: helicon
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: helicon
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helicon"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://helicon:local-only@db:5432/helicon
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
